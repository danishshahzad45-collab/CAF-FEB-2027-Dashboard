<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAF February 2027 Dashboard</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101e31;color:#f4f7fb;font:16px system-ui,sans-serif}.panel{max-width:620px;margin:24px;padding:32px;border:1px solid #344b65;border-radius:18px;background:#172a40;box-shadow:0 18px 50px #0005}h2{margin-top:0}p{line-height:1.6;color:#d0dbea}#msg{color:#8fd5ff}
</style>
</head>
<body>
<div class="panel">
<h2>CAF February 2027 Dashboard</h2>
<p id="msg">Loading your complete study dashboard and detailed Roman Urdu notes…</p>
<p><small>Internet is required to load updated content. Your study progress is saved in this browser.</small></p>
</div>
<script>
(async()=>{
 const msg=document.getElementById('msg');
 const fetchParts=async(base,count,label)=>{
  return Promise.all(Array.from({length:count},(_,i)=>
   fetch(base+'part-'+i+'.txt?v='+Date.now(),{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('Could not load '+label+' file '+(i+1));return r.text()})
  ));
 };
 const unpack=async(encoded)=>{
  const binary=atob(encoded.replace(/\s/g,''));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window))throw new Error('Please use the latest Chrome or Edge browser.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
 };
 try{
  const raw='https://raw.githubusercontent.com/danishshahzad45-collab/CAF-FEB-2027-Dashboard/main/';
  const baseParts=await fetchParts(raw+'payload/',9,'dashboard');
  const html=await unpack(baseParts.join(''));
  if(!html.includes('<!DOCTYPE html>')||!html.includes('CAF | February 2027 Command Centre'))throw new Error('Dashboard integrity check failed.');
  const noteParts=await fetchParts(raw+'notes/',10,'detailed notes');
  const patch=await unpack(noteParts.join(''));
  if(!patch.includes('Treatment D — Material by-product')||!patch.includes('Abnormal loss units'))throw new Error('Detailed notes integrity check failed.');
  const scriptOpen='<scr'+'ipt>';
  const scriptClose='</scr'+'ipt>';
  const injected=html.replace(/<\/body>/i,scriptOpen+patch+scriptClose+'</body>');
  if(injected===html)throw new Error('Dashboard closing tag check failed.');
  document.open();document.write(injected);document.close();
 }catch(err){
  msg.textContent='Dashboard could not fully load: '+err.message+'. Refresh or open in latest Chrome/Edge.';
 }
})();
</script>
</body>
</html>
